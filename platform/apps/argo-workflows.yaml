# Argo CD Application: argo-workflows. Created by the root application from this directory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 2.0.18
      helm:
        valueFiles:
          - $values/platform/components/argo-workflows.values.yaml
    - repoURL: https://github.com/gaskinimbuspro/agentic-sdlc.git
      targetRevision: claude/nice-dijkstra-2lc88p
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
