# Argo CD ApplicationSet: one Application per project environment.
# Each project has a separate deploy repository in Forgejo with overlays/<env>.
# Staging changes when the release pipeline sets a new image digest; prod
# changes only through a pull request approved and merged by the product owner.
# Add a project by adding an element below. Argo CD reads the deploy
# repositories with the read-only credentials from connect-argocd.sh.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: projects
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - project: demo
                  deployRepo: demo/project-deploy
          - list:
              elements:
                - env: staging
                - env: prod
  template:
    metadata:
      name: "{{.project}}-{{.env}}"
      labels:
        project: "{{.project}}"
        env: "{{.env}}"
    spec:
      project: default
      source:
        repoURL: "http://forgejo-http.forgejo.svc.cluster.local:3000/{{.deployRepo}}.git"
        targetRevision: main
        path: "overlays/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.project}}-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
