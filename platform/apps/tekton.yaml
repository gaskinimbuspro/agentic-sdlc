# Argo CD Application: tekton. Created by the root application from this directory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
  source:
    repoURL: https://github.com/gaskinimbuspro/agentic-sdlc.git
    targetRevision: claude/nice-dijkstra-2lc88p
    path: platform/components/tekton
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
