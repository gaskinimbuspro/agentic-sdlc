[project]
name = "customer-api-reference"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.163.1", "psycopg[binary]==3.3.9", "PyJWT==2.15.1", "uvicorn>=0.34,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyJWT"]

[tool.hatch.build.targets.wheel]
packages = ["src/customer_api"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
