<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">Illustrative customer administration wireframes</title><desc id="desc">List screen with Add customer action and create screen with labeled fields, Save and Cancel. Planning reference only.</desc><rect width="1120" height="600" fill="#f1f5f9"/><g fill="#0f172a" font-family="system-ui,sans-serif"><text x="32" y="40" font-size="22">Customer administration — low-fidelity planning reference</text><text x="32" y="68" font-size="14">Illustrative, unapproved design. Error/loading/access states are specified separately.</text><rect x="32" y="100" width="510" height="410" rx="12" fill="white" stroke="#64748b"/><rect x="570" y="100" width="510" height="410" rx="12" fill="white" stroke="#64748b"/><text x="56" y="140" font-size="14">LIST · /customers</text><text x="56" y="188" font-size="28">Customers</text><rect x="56" y="214" width="160" height="42" rx="6" fill="#1d4ed8"/><text x="74" y="241" font-size="16" fill="white">Add customer</text><text x="56" y="294" font-size="16">Name</text><text x="252" y="294" font-size="16">Email</text><path d="M56 310H514M56 358H514" stroke="#64748b"/><text x="56" y="340" font-size="16">Ada</text><text x="252" y="340" font-size="16">ada@example.test</text><text x="56" y="404" font-size="14">Empty/error/loading/access variants:</text><text x="56" y="428" font-size="14">see the versioned screen/state packet.</text><text x="594" y="140" font-size="14">CREATE · /customers/new</text><text x="594" y="188" font-size="28">Add customer</text><text x="594" y="226" font-size="16">Name</text><rect x="594" y="236" width="458" height="42" rx="4" fill="white" stroke="#64748b"/><text x="594" y="314" font-size="16">Email</text><rect x="594" y="324" width="458" height="42" rx="4" fill="white" stroke="#64748b"/><rect x="594" y="400" width="172" height="44" rx="6" fill="#1d4ed8"/><text x="612" y="428" font-size="16" fill="white">Save customer</text><text x="794" y="428" font-size="16">Cancel</text><text x="32" y="552" font-size="14">Success returns to LIST. Cancel makes no create request. No login, edit or delete screen is implied.</text></g></svg>