[project]
name = "backend-standard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
backend-standard = "backend_standard.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema>=4.23", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "pip-audit>=2.8,<3", "build>=1.2,<2"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = ["integration: requires an actual PostgreSQL server and compiled reference backend"]
