[project]
name = "backend-standard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "defusedxml==0.7.1",
    "jsonschema>=4.23,<5",
]

[project.scripts]
backend-standard = "backend_standard.cli:main"
backend-verify = "backend_standard.runner:main"
ui-standard = "backend_standard.ui:main"

[build-system]
requires = ["hatchling==1.33.0", "editables==0.5"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-jsonschema>=4.23",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pip-audit>=2.8,<3",
    "build>=1.2,<2",
    "bandit>=1.8,<2",
    "types-defusedxml>=0.7",
    "hatchling==1.33.0",
    "editables==0.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = ["integration: requires an actual PostgreSQL server and compiled reference backend"]
